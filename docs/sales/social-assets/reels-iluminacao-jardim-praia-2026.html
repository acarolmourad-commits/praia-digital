<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reels — Iluminação de Jardim Anti-Maresia | Praia Digital</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0b1220; color: #e8ecf1; }
  .reels { width: 1080px; height: 1920px; padding: 80px; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; }
  .badge { display: inline-block; background: rgba(255,255,255,.15); padding: 12px 20px; border-radius: 999px; font-size: 20px; margin-bottom: 24px; border: 1px solid rgba(255,255,255,.25); animation: fadeIn 0.8s ease-out; }
  .icon { font-size: 120px; margin-bottom: 40px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
  h1 { font-size: 68px; line-height: 1.15; margin-bottom: 24px; font-weight: 800; animation: fadeIn 1s ease-out; }
  p { font-size: 28px; line-height: 1.5; opacity: .92; margin-bottom: 30px; animation: fadeIn 1.2s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .cta { display: inline-block; padding: 22px 40px; border-radius: 999px; background: #00B4D8; color: #fff; text-decoration: none; font-weight: 800; font-size: 26px; animation: fadeIn 1.4s ease-out; }
  .brand { margin-top: 60px; font-size: 20px; opacity: .8; }
  .sparkle { position: absolute; width: 6px; height: 6px; background: #fff; border-radius: 50%; animation: sparkle 2s linear infinite; }
  @keyframes sparkle { 0%, 100% { opacity: 0; transform: scale(0); } 50% { opacity: 1; transform: scale(1); } }
  .sparkle-1 { top: 12%; left: 18%; animation-delay: 0s; }
  .sparkle-2 { top: 22%; right: 22%; animation-delay: 0.5s; }
  .sparkle-3 { bottom: 28%; left: 12%; animation-delay: 1s; }
  .sparkle-4 { bottom: 18%; right: 18%; animation-delay: 1.5s; }
</style>
</head>
<body>
  <div class="reels">
    <div class="sparkle sparkle-1"></div>
    <div class="sparkle sparkle-2"></div>
    <div class="sparkle sparkle-3"></div>
    <div class="sparkle sparkle-4"></div>
    <div class="badge">Projeto luminotécnico anti-maresia</div>
    <div class="icon">💡</div>
    <h1>Iluminação externa que resiste à maresia na Riviera</h1>
    <p>Balizadores em aço inoxidável 316, refletores solares proteção IP68 e fitas LED de silicone para decks e jardins.</p>

    <p class="brand">Praia Digital — Litoral Prime Imóveis</p>
  </div>
</body>
</html>
