name: Neutralize breadcrumb generators (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  neutralize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Neutralize breadcrumb generators
        run: python scripts/neutralize_breadcrumb_generators.py
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: neutraliza geracao de breadcrumbs nos scripts de automacao"
            git push
          fi
