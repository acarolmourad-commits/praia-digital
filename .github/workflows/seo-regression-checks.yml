name: SEO metadata and sitemap checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Listing schema regression tests
        run: python3 -m unittest discover -s tests -p 'test_listing_schema.py' -v
      - name: Sitemap validator regression tests
        run: python3 -m unittest discover -s tests -p 'test_sitemap_targets.py' -v
      - name: Sitemap generator regression tests
        run: python3 -m unittest discover -s tests -p 'test_sitemap_generator.py' -v
      - name: Removed listing regression tests
        run: python3 -m unittest discover -s tests -p 'test_removed_listings.py' -v
      - name: Search Console article and city guide regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_gsc_article_cleanup.py' -v
          python3 -m unittest discover -s tests -p 'test_city_search_links.py' -v
      - name: Practical host article content and conversion regressions
        run: python3 -m unittest discover -s tests -p 'test_host_lead_articles.py' -v
      - name: Validate published sitemap targets
        run: python3 scripts/validate_sitemap_targets.py
