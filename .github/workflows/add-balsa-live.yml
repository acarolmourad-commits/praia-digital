name: add-balsa-live-cams
on:
  push:
    paths:
      - '.github/workflows/add-balsa-live.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert live ferry camera cards
        run: |
          python3 << 'PYEOF'
          import pathlib, re
          NL = chr(10)
          def card(cam1, lab1, cam2, lab2, src):
              fig = lambda c, l: ('<figure style="margin:0"><img class="pd-cam" data-cam="' + c + '" src="' + c + '" alt="Camera ao vivo - ' + l + '" style="width:100%;border-radius:10px" loading="lazy">'
                                  '<figcaption style="font-size:.8rem;color:#374151">' + l + '</figcaption></figure>')
              return ('<div class="card"><h3>\U0001F4F9 Balsa ao vivo \u2014 c\u00e2meras em tempo real</h3>'
                      '<p>Imagens p\u00fablicas da travessia, atualizadas automaticamente a cada 60 segundos:</p>'
                      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' + fig(cam1, lab1) + fig(cam2, lab2) + '</div>'
                      '<p>Fonte: <a href="' + src + '" rel="noopener" target="_blank">Costa Norte \u2014 c\u00e2meras e tempo de espera da travessia</a> (servi\u00e7o p\u00fablico e gratuito).</p></div>')
          SCRIPT = ('<script>(function(){var cams=document.querySelectorAll("img.pd-cam");if(!cams.length)return;'
                    'setInterval(function(){cams.forEach(function(i){i.src=i.dataset.cam+"?t="+Date.now();});},60000);})();</script>')
          CARDS = {
            'santos': card('https://costanorte.com.br/media/cameras/img_48.jpg','Lado Santos \u2014 Bols\u00e3o','https://costanorte.com.br/media/cameras/img_50.jpg','Lado Guaruj\u00e1 \u2014 Bols\u00e3o','https://costanorte.com.br/balsas/santos-guaruja'),
            'guaruja': card('https://costanorte.com.br/media/cameras/img_50.jpg','Lado Guaruj\u00e1 \u2014 Bols\u00e3o','https://costanorte.com.br/media/cameras/img_48.jpg','Lado Santos \u2014 Bols\u00e3o','https://costanorte.com.br/balsas/santos-guaruja'),
            'sao-sebastiao': card('https://costanorte.com.br/media/cameras/img_55.jpg','Lado S\u00e3o Sebasti\u00e3o \u2014 Bols\u00e3o','https://costanorte.com.br/media/cameras/img_59.jpg','Lado Ilhabela \u2014 Fila','https://costanorte.com.br/balsas/ilhabela'),
            'ilhabela': card('https://costanorte.com.br/media/cameras/img_59.jpg','Lado Ilhabela \u2014 Fila','https://costanorte.com.br/media/cameras/img_55.jpg','Lado S\u00e3o Sebasti\u00e3o \u2014 Bols\u00e3o','https://costanorte.com.br/balsas/ilhabela'),
          }
          def insert_after_balsa_card(t, payload):
              h = t.find('Balsa')
              while h != -1:
                  if '<h3>' in t[max(0,h-10):h+1] or t.rfind('<h3', 0, h) > t.rfind('</h3>', 0, h):
                      break
                  h = t.find('Balsa', h+1)
              h3 = t.rfind('<h3', 0, h)
              start = t.rfind('<div class="card"', 0, h3)
              if start == -1: return None
              bal = 0
              for m in re.finditer('</?div[ >]', t[start:]):
                  bal += -1 if m.group(0).startswith('</') else 1
                  if bal == 0:
                      end = start + m.end()
                      return t[:end] + NL + '        ' + payload + NL + '        ' + SCRIPT + t[end:]
              return None
          changed = 0
          for city, payload in CARDS.items():
              files = [pathlib.Path('cidades')/(city+'.html')] + sorted(pathlib.Path('bairros', city).glob('*.html'))
              for p in files:
                  if not p.exists() or p.name == 'index.html': continue
                  t = p.read_text(encoding='utf-8')
                  if 'pd-cam' in t or 'Balsa' not in t: continue
                  nt = insert_after_balsa_card(t, payload)
                  if nt:
                      p.write_text(nt, encoding='utf-8')
                      changed += 1
                      print('OK', p)
                  else:
                      print('FAIL', p)
          print('TOTAL', changed)
          PYEOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feat(balsa): cameras ao vivo da travessia (Costa Norte) nas paginas de Santos, Guaruja, Sao Sebastiao e Ilhabela"
            git push
          fi
