name: Fix Broken Links (apply)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar correcoes de alta confianca
        run: python scripts/fix_broken_links.py
      - name: Commitar em branch de correcao
        run: |
          if [ -z "$(git status --porcelain -- '*.html')" ]; then
            echo 'Nenhuma correcao pendente.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b fix/broken-links-auto
          git add -- '*.html' ':!fix_links_report.json'
          git commit -m 'fix(links): corrige links internos quebrados (automatico via fix_broken_links.py)'
          git push -f origin fix/broken-links-auto
