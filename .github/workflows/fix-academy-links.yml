name: Fix academy course links
on:
  push:
    paths:
      - 'tools/fix_academy_links.py'
      - '.github/workflows/fix-academy-links.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply replacements
        run: python3 tools/fix_academy_links.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada para commitar"
          else
            git commit -m "fix: redireciona links academy.praia.digital/courses para cursos locais (endpoint morto)"
            git push
          fi
