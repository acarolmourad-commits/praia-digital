name: Apply precos 499 2026-10-21 (one-shot)

on:
  push:
    branches: ['feat/precos-499-20261021']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply R$ 499 prices and new Stripe links
        run: python scripts/apply_precos_499_20261021.py
      - name: Commit and push page changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html servicos.html servicos/propaganda-imobiliaria.html servicos/anuncios-airbnb-booking.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(precos): criacao de anuncios R\$ 499 (2x = R\$ 998) e novos links Stripe"
            git push origin HEAD:${{ github.ref_name }}
          fi
