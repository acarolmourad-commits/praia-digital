name: Generate ferramentas index
on:
  push:
    paths:
      - 'tools/gen_ferramentas_index.py'
      - '.github/workflows/gen-ferramentas-index.yml'
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate index
        run: python3 tools/gen_ferramentas_index.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada para commitar"
          else
            git commit -m "feat: cria indice ferramentas-gratuitas (resolve 404, lista 32 ferramentas)"
            git push
          fi
