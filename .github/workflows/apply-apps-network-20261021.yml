name: Aplicar rede de apps Praia Digital 2026-10-21 (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Interligar rede de apps
        run: python scripts/fix_apps_network_20261021.py
      - name: Commit and push page changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/index.html
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
          else
            git commit -m "fix(apps): remove link ASF, corrige ancora e interliga Novidades Airbnb/Booking"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Disparar deploy do site
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
