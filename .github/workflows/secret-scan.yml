name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run secret scan
        id: secret_scan
        run: |
          detect-secrets scan --all-files \
            --exclude-files ".*backup.*|.*dashboards/.*|.*blog/.*|.*docs/sales/.*|.*\.git/.*|.*__pycache__/.*|.*node_modules/.*|.*\.pytest_cache/.*|.*\.hermes-tmp-idempotency/.*" \
            --exclude-secrets ".*placeholder.*|.*example.*" \
            . > .secrets.scan_result.json 2>&1 || true

      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-result
          path: .secrets.scan_result.json
          retention-days: 7

      - name: Evaluate scan result
        run: python scripts/ci/parse_secret_scan.py
