name: Santos and Guaruja seasonal guide checks
on:
  pull_request:
    paths:
      - 'cidades/santos-compra-programada.html'
      - 'cidades/guaruja-academia.html'
      - 'blog/guaruja-guia-locacao-temporada-imoveis-2026.html'
      - 'tests/guaruja-temporada-browser.cjs'
      - 'blog/santos-guia-locacao-temporada-imoveis-2026.html'
      - 'tests/santos-temporada-browser.cjs'
      - '.github/workflows/santos-temporada-checks.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/santos-browser" playwright@1.63.0 --no-audit --no-fund
          "$RUNNER_TEMP/santos-browser/node_modules/.bin/playwright" install --with-deps chromium --only-shell
      - name: Check guide structure and responsive navigation
        run: |
          NODE_PATH="$RUNNER_TEMP/santos-browser/node_modules" node tests/santos-temporada-browser.cjs
          NODE_PATH="$RUNNER_TEMP/santos-browser/node_modules" node tests/guaruja-temporada-browser.cjs
