name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_name: ${{ steps.package.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare shared navigation
        run: |
          python3 scripts/build-content-discovery.py
          python3 -m unittest discover -s tests -p 'test_navigation.py'
          python3 scripts/build-navigation.py --report "$RUNNER_TEMP/navigation-report.json"
          python3 scripts/fix_empty_h1.py

      - name: Exclude assisted-delivery workbooks from public Pages
        run: python3 scripts/prepare_academy_publication.py

      - name: Enforce owner-approved listing retirements
        run: |
          python3 scripts/enforce_listing_retirements.py --apply
          python3 -m unittest discover -s tests -p 'test_listing_retirements.py'
          python3 scripts/enforce_listing_retirements.py

      - name: Validate sitemap before publication
        run: python3 scripts/validate_sitemap_targets.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Name this build's artifact
        id: package
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.package.outputs.name }}
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
