name: Deploy to GitHub Pages

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare shared navigation
        run: |
          python3 -m unittest discover -s tests -p 'test_navigation.py'
          python3 scripts/build-navigation.py --report "$RUNNER_TEMP/navigation-report.json"
          python3 scripts/fix_empty_h1.py

      - name: Test public artifact boundary
        run: python3 -m unittest discover -s tests -p 'test_pages_public.py'

      - name: Prepare explicitly reviewed public artifact
        run: |
          python3 scripts/prepare_pages_public.py --source "$GITHUB_WORKSPACE" --destination "$RUNNER_TEMP/praia-public" --manifest config/pages-public-manifest.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/praia-public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
