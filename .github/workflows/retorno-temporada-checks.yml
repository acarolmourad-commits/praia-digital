name: Legacy temporada calculator checks
on:
  pull_request:
    paths:
      - 'ferramentas-gratuitas/imobiliarias/analise-retorno-temporada-litoral.html'
      - 'tests/retorno-temporada-browser.cjs'
      - '.github/workflows/retorno-temporada-checks.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/retorno-browser" playwright@1.63.0 --no-audit --no-fund
          "$RUNNER_TEMP/retorno-browser/node_modules/.bin/playwright" install --with-deps chromium --only-shell
      - name: Run isolated calculation and browser checks
        run: NODE_PATH="$RUNNER_TEMP/retorno-browser/node_modules" node tests/retorno-temporada-browser.cjs
