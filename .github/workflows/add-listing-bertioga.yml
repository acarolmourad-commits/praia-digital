name: Add Bertioga R$595k listing (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run add-listing script
        run: python scripts/add-listing-bertioga-595.py
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: add Bertioga condo house listing (R$595.000) to homepage"
            git push
          fi
