name: Homepage conversion journeys

on:
  pull_request:
    paths:
      - 'index.html'
      - 'imoveis.html'
      - 'encontrar-imovel.html'
      - 'interesse.html'
      - 'cases.html'
      - 'anfitrioes/central-priceplabs.html'
      - 'imoveis/casa-jardim-indaia-180m2.html'
      - 'assets/casa-jardim-indaia-180m2/**'
      - 'tests/test_house_jardim_indaia.py'
      - 'tests/house-jardim-indaia-browser.cjs'
      - 'imoveis/casa-terrea-bertioga-675m2.html'
      - 'assets/casa-terrea-bertioga-675m2/**'
      - 'tests/test_house_bertioga.*'
      - 'imoveis/apartamento-indaia-bertioga-84m2.html'
      - 'assets/apartamento-indaia-bertioga-84m2/**'
      - 'tests/test_apartment_indaia_84m2.py'
      - 'tests/apartment-indaia-84m2-browser.cjs'
      - 'imoveis/apartamento-indaia-88m2.html'
      - 'assets/apartamento-indaia-88m2/**'
      - 'tests/test_apartment_indaia.*'
      - 'tests/apartment-indaia-browser.cjs'
      - 'tests/test_city_guides.cjs'
      - 'js/**'
      - 'css/**'
      - 'assets/css/**'
      - 'partials/**'
      - 'scripts/build-navigation.py'
      - 'tests/homepage-browser.cjs'
      - 'tests/test_property_search.cjs'
      - 'tests/test_contact_cases.cjs'
      - 'tests/test_homepage_content.py'
      - '.github/workflows/homepage-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Listing photo validation dependency
        run: python3 -m pip install Pillow
      - name: JavaScript syntax
        run: |
          node --check js/shared.js
          node --check js/main.js
          node --check js/property-search.js
          node --check js/home-search.js
          node --check tests/homepage-browser.cjs
          node --check tests/apartment-indaia-browser.cjs
          node --check tests/apartment-indaia-84m2-browser.cjs
          node --check tests/house-jardim-indaia-browser.cjs
      - name: Focused homepage and conversion regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_homepage_content.py' -v
          node tests/test_property_search.cjs
          node tests/test_house_bertioga.cjs
          node tests/test_apartment_bertioga.cjs
          node tests/test_apartment_indaia.cjs
          node tests/test_city_guides.cjs
          python3 -m unittest discover -s tests -p 'test_apartment_*.py' -v
          python3 -m unittest discover -s tests -p 'test_house_*.py' -v
          node tests/test_contact_cases.cjs
      - name: Build the navigation used by deployment
        run: python3 scripts/build-navigation.py --report "$RUNNER_TEMP/homepage-navigation.json"
      - name: Browser journey tests (offline, no form submission)
        env:
          HOMEPAGE_QA_OUTPUT: ${{ runner.temp }}/homepage-qa
          INDAIA_QA_OUTPUT: ${{ runner.temp }}/indaia-qa
        run: |
          npm install --prefix "$RUNNER_TEMP/homepage-browser" playwright@1.63.0 --no-audit --no-fund
          "$RUNNER_TEMP/homepage-browser/node_modules/.bin/playwright" install --with-deps chromium --only-shell
          NODE_PATH="$RUNNER_TEMP/homepage-browser/node_modules" node tests/homepage-browser.cjs
          NODE_PATH="$RUNNER_TEMP/homepage-browser/node_modules" node tests/apartment-indaia-browser.cjs
          NODE_PATH="$RUNNER_TEMP/homepage-browser/node_modules" node tests/apartment-indaia-84m2-browser.cjs
          NODE_PATH="$RUNNER_TEMP/homepage-browser/node_modules" node tests/house-jardim-indaia-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-browser-evidence
          path: |
            ${{ runner.temp }}/homepage-qa
            ${{ runner.temp }}/indaia-qa
            ${{ runner.temp }}/homepage-navigation.json
          if-no-files-found: warn
