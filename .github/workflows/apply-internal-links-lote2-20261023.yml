name: Apply internal links lote2 2026-10-23 (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inserir links internos para o lote 2
        run: python scripts/patch_internal_links_lote2_20261023.py
      - name: Commit and push page changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/compra-imovel-heranca-inventario-litoral-2026.html blog/analise-seo-imobiliarias-litoral-oportunidades-2026.html blog/contrato-aluguel-temporada-litoral-clausulas-2026.html blog/como-usar-fgts-2026.html blog/como-morar-enseada-guaruja-2026.html
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
          else
            git commit -m "seo: links internos dos artigos antigos para o lote 2 GSC"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Disparar deploy do site
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
