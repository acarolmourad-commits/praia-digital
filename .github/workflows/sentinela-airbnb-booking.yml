name: Sentinela Airbnb + Booking (a cada 6h)

on:
  schedule:
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sentinela-airbnb-booking
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Monitorar fontes oficiais e gerar posts
        id: sentinela
        run: python3 scripts/sentinela_airbnb_booking.py

      - name: Commitar estado, relatorio e posts
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/marketplaces/sentinela-estado.json novidades-airbnb-booking/
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "Sem alteracoes."
          else
            git commit -m "chore(sentinela): monitoramento Airbnb + Booking [skip ci]"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Disparar deploy do site
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Abrir issue de acompanhamento
        if: steps.sentinela.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Novidade Airbnb/Booking publicada automaticamente - $(date -u +%F)" \
            --body-file automation/marketplaces/sentinela-report.md || true
