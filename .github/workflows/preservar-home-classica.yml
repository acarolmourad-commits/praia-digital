name: Preservar home classica
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copia home atual para home-classica.html
        run: |
          if [ ! -f home-classica.html ]; then cp index.html home-classica.html; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add home-classica.html
          git diff --cached --quiet || git commit -m "chore: preserva home classica em home-classica.html"
          git push
