name: Fix dark theme contrast
on:
  push:
    paths:
      - 'tools/fix_dark_theme.py'
      - '.github/workflows/fix-dark-theme.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python3 tools/fix_dark_theme.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada para commitar"
          else
            git commit -m "fix: tema claro legivel em 1239 paginas (remove conflito tema escuro x style.css)"
            git push
          fi
