name: Atualizar sitemap do apartamento Indaia
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-sitemap.yml'
permissions:
  contents: write
jobs:
  patch-sitemap:
    if: github.ref == 'refs/heads/feat/apartamento-indaia-88m2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir somente URL do apartamento Indaia
        run: |
          python3 - <<'PYEOF'
          p='sitemap.xml'
          s=open(p,encoding='utf-8').read()
          url='https://praia.digital/imoveis/apartamento-indaia-88m2.html'
          add='' if url in s else '<url><loc>'+url+'</loc><lastmod>2026-11-03</lastmod><changefreq>weekly</changefreq><priority>0.8</priority></url>\n'
          if add:
              s=s.replace('</urlset>', add+'</urlset>')
              open(p,'w',encoding='utf-8').write(s)
          print('URLs inseridas:', add.count('<url>'))
          PYEOF
      - name: Commit e push (se houver mudanca)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet && echo "Nada a commitar" || (git commit -m "sitemap: incluir apartamento Indaia" && git push)
