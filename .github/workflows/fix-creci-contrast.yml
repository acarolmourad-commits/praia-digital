name: Fix CRECI page contrast
on:
  push:
    paths:
      - 'tools/fix_creci_contrast.py'
      - '.github/workflows/fix-creci-contrast.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python3 tools/fix_creci_contrast.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada para commitar"
          else
            git commit -m "fix(blog): corrige contraste da pagina simulados CRECI - tema claro legivel (design system)"
            git push
          fi
