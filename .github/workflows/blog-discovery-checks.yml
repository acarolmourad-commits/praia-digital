name: Blog discovery and host guide checks

on:
  pull_request:
    paths:
      - 'blog/**'
      - 'anfitrioes/index.html'
      - 'js/blog-search.js'
      - 'assets/css/blog-discovery.css'
      - 'assets/css/editorial-guides.css'
      - 'tests/blog-search.test.cjs'
      - 'tests/test_blog_discovery.py'
      - 'tests/editorial-guides-browser.cjs'
      - 'css/style.css'
      - 'js/shared.js'
      - 'js/pd-navigation.js'
      - 'assets/css/pd-navigation.css'
      - 'partials/**'
      - 'scripts/build-navigation.py'
      - '.github/workflows/blog-discovery-checks.yml'
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - 'anfitrioes/index.html'
      - 'js/blog-search.js'
      - 'assets/css/blog-discovery.css'
      - 'assets/css/editorial-guides.css'
      - 'tests/blog-search.test.cjs'
      - 'tests/test_blog_discovery.py'
      - 'tests/editorial-guides-browser.cjs'
      - 'css/style.css'
      - 'js/shared.js'
      - 'js/pd-navigation.js'
      - 'assets/css/pd-navigation.css'
      - 'partials/**'
      - 'scripts/build-navigation.py'
      - '.github/workflows/blog-discovery-checks.yml'

permissions:
  contents: read

jobs:
  blog-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search behavior regressions
        run: node --test tests/blog-search.test.cjs
      - name: Editorial metadata and discovery paths
        run: python3 -m unittest discover -s tests -p 'test_blog_discovery.py' -v
      - name: Mobile editorial journeys (offline)
        env:
          EDITORIAL_QA_OUTPUT: ${{ runner.temp }}/editorial-qa
        run: |
          npm install --prefix "$RUNNER_TEMP/editorial-browser" playwright@1.63.0 --no-audit --no-fund
          "$RUNNER_TEMP/editorial-browser/node_modules/.bin/playwright" install --with-deps chromium --only-shell
          NODE_PATH="$RUNNER_TEMP/editorial-browser/node_modules" node tests/editorial-guides-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-mobile-evidence
          path: ${{ runner.temp }}/editorial-qa
          if-no-files-found: warn
