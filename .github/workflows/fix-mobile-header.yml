name: Fix mobile header (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply header fixes
        run: python scripts/fix_mobile_header.py
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: header mobile fora do container .wrap na calculadora e CSS direto em imoveis.html"
            git push
          fi
