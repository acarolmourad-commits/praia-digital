name: Estoque Vivo
on:
  pull_request:
    paths: ['workers/estoque-vivo/**', '.github/workflows/estoque-vivo.yml']
  push:
    branches: [main]
    paths: ['workers/estoque-vivo/**', '.github/workflows/estoque-vivo.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/estoque-vivo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/estoque-vivo/package-lock.json
      - run: npm ci
      - run: npm test
