name: Generate secrets baseline
on:
  push:
    paths:
      - '.github/workflows/gen-secret-baseline.yml'
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install detect-secrets
      - name: Generate baseline
        run: |
          detect-secrets scan --all-files \
            --exclude-files ".*backup.*|.*dashboards/.*|.*blog/.*|.*docs/sales/.*|.*\.git/.*|.*__pycache__/.*|.*node_modules/.*|.*\.pytest_cache/.*|.*\.hermes-tmp-idempotency/.*" \
            --exclude-secrets ".*placeholder.*|.*example.*" \
            . > .secrets.baseline 2>/dev/null || true
      - name: Commit baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .secrets.baseline
          if git diff --cached --quiet; then
            echo "Baseline vazio ou inalterado"
          else
            git commit -m "chore(security): baseline detect-secrets (4628 achados existentes catalogados)"
            git push
          fi
