name: Remove breadcrumbs (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-breadcrumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run breadcrumb removal script
        run: python scripts/remove_breadcrumbs.py
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove breadcrumbs: nav visual, CSS orfao e JSON-LD BreadcrumbList (preserva demais schemas)"
            git push
          fi
