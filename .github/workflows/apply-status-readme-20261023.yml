name: Apply status readme 2026-10-23 (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Atualizar STATUS e README
        run: python scripts/patch_status_readme_20261023.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS-EXECUTIVO.md README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: atualiza status executivo e secao GSC do README"
            git push
          fi
