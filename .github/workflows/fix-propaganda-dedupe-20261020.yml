name: Fix Propaganda dedupe 2026-10-20 (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Propaganda deduplication and R$ 500 sale/rental pricing
        run: python scripts/fix_propaganda_dedupe_20261020.py
      - name: Commit and push page changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servicos.html servicos/propaganda-imobiliaria.html servicos/anuncios-airbnb-booking.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(servicos): dedupe Propaganda, preco R\$ 500 venda/locacao e Stripe"
            git push
          fi
