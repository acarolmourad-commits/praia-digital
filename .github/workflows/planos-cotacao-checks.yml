name: Professional services quotation
on:
  pull_request:
    paths: ['planos.html', 'entrega-descricoes-ia.html', 'entrega-kit-temporada.html', 'entrega-relatorio-avaliacao.html', 'termos-sem-fidelidade.html', 'css/planos-cotacao.css', 'tests/test_planos_cotacao.py', 'tests/planos-cotacao-browser.cjs', '.github/workflows/planos-cotacao-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tests/test_planos_cotacao.py
      - name: Prepare production navigation and browser checks
        run: |
          python3 scripts/build-navigation.py
          npm install --prefix "$RUNNER_TEMP/planos-qa" playwright@1.63.0 --no-audit --no-fund
          "$RUNNER_TEMP/planos-qa/node_modules/.bin/playwright" install --with-deps chromium --only-shell
          NODE_PATH="$RUNNER_TEMP/planos-qa/node_modules" node tests/planos-cotacao-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planos-quotation-screenshots
          path: /tmp/planos-*.png
