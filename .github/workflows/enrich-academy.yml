name: Enrich Academy pages
on:
  push:
    paths:
      - 'tools/enrich_academy.py'
      - '.github/workflows/enrich-academy.yml'
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply enrichment
        run: python3 tools/enrich_academy.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada para commitar"
          else
            git commit -m "feat(education): padroniza layout Academy - tabelas de modulos reais, graficos e infos do curso (67 cursos + 8 formacoes)"
            git push
          fi
