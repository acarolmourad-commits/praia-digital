name: Academy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd academy
          pip install -r requirements.txt
          pip install pytest

      - name: Validate imports
        run: |
          cd academy
          python -c "from academy.core import config, whatsapp_service, email_service; from academy.core import middleware; from academy.routers import monitoring, payments, certificates, automation_whatsapp, automation_email"

      - name: Run unit tests
        run: |
          cd academy
          pytest tests/ -q

      - name: Clean test artifacts
        run: |
          git reset --hard HEAD
          git clean -fd academy/uploads academy/proprietarios || true
          git status --porcelain

      - name: Pre-deploy validation
        run: python scripts/validate_render_deploy.py --check-mode ${{ github.event_name == 'pull_request' && 'pr' || 'deployment' }}

      - name: Validate 64-course inventory
        run: python scripts/validate_academy_inventory.py

  # Publicacao Pages removida deste workflow em 2026-10-16:
  # quem publica o site e exclusivamente "Deploy to GitHub Pages" (.github/workflows/deploy.yml),
  # para eliminar deploys concorrentes (deploy-preview falhou apos testes verdes - run 37796353912).
  # O job test acima continua como gate de PR/push.
