name: Academy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd academy
          pip install -r requirements.txt
          pip install pytest

      - name: Validate imports
        run: |
          cd academy
          python -c "from academy.core import config, whatsapp_service, email_service; from academy.core import middleware; from academy.routers import monitoring, payments, certificates, automation_whatsapp, automation_email"

      - name: Run unit tests
        run: |
          cd academy
          pytest tests/ -q

      - name: Clean test artifacts
        run: |
          git reset --hard HEAD
          git clean -fd academy/uploads academy/proprietarios || true
          git status --porcelain

      - name: Pre-deploy validation
        run: python scripts/validate_render_deploy.py --check-mode ${{ github.event_name == 'pull_request' && 'pr' || 'deployment' }}

      - name: Validate 64-course inventory
        run: python scripts/validate_academy_inventory.py

  deploy-preview:
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare shared navigation
        run: python3 scripts/build-navigation.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  post-deploy-validation:
    needs: deploy-preview
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests
      - name: Run production validation
        env:
          ACADEMY_BASE_URL: ${{ vars.ACADEMY_BASE_URL || 'https://academy.praia.digital' }}
        run: |
          python scripts/validate_academy_prod.py
