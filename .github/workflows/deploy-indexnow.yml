name: Deploy and IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run IndexNow
        run: python scripts/indexnow.py
