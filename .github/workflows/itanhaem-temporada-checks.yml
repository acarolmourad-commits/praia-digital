name: Itanhaem seasonal guide checks
on:
  pull_request:
    paths:
      - 'blog/itanhaem-guia-locacao-temporada-imoveis-2026.html'
      - 'tests/itanhaem-temporada-browser.cjs'
      - '.github/workflows/itanhaem-temporada-checks.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/itanhaem-browser" playwright@1.63.0 --no-audit --no-fund
          "$RUNNER_TEMP/itanhaem-browser/node_modules/.bin/playwright" install --with-deps chromium --only-shell
      - name: Check guide structure and responsive navigation
        run: NODE_PATH="$RUNNER_TEMP/itanhaem-browser/node_modules" node tests/itanhaem-temporada-browser.cjs
