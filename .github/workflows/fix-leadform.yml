name: fix-leadform
on:
  push:
    paths:
      - '.github/workflows/fix-leadform.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix leadForm script in bairros pages
        run: |
          python3 << 'PYEOF'
          import pathlib, re

          NEW = ('<script>(function(){var form=document.getElementById("leadForm");'
                 'if(!form) return;'
                 'form.addEventListener("submit",function(e){e.preventDefault();'
                 'var data={'
                 'name:document.getElementById("name").value.trim(),'
                 'email:document.getElementById("email").value.trim(),'
                 'phone:document.getElementById("phone").value.trim(),'
                 'city:document.getElementById("city").value,'
                 'source:document.getElementById("source").value,'
                 'magnet:document.getElementById("magnet").value'
                 '};'
                 'fetch("https://academy.praia.digital/leads",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)})'
                 '.then(function(r){return r.json().then(function(json){return {status:r.status,json:json};});})'
                 '.then(function(res){document.getElementById("formStatus").textContent=res.status===200?"Recebido! Entraremos em contato.":"Erro: "+JSON.stringify(res.json);})'
                 '.catch(function(){document.getElementById("formStatus").textContent="Erro de conex\u00e3o. Tente novamente.";});'
                 '});})();</script>')

          changed = []
          for p in pathlib.Path('.').rglob('*.html'):
              t = p.read_text(encoding='utf-8')
              if 'id="leadForm"' not in t:
                  continue
              idx = t.find('<script>(function(){')
              if idx == -1:
                  continue
              end = t.find('</script>', idx)
              if end == -1:
                  continue
              block = t[idx:end]
              if 'leadForm' not in block:
                  continue
              nt = t[:idx] + NEW + t[end:]
              if nt != t:
                  p.write_text(nt, encoding='utf-8')
                  changed.append(str(p))
          print(f'fixed {len(changed)} files')
          for c in changed:
              print(c)
          PYEOF
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fix(leadForm): corrige sintaxe quebrada do script de captura de leads (.trim()null / .valuenull / chaves duplicadas) nas páginas de bairro"
            git push
          fi
