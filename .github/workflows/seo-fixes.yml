name: SEO fixes (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-seo-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SEO fixes script
        run: python scripts/seo-fixes.py
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "seo: apply og:image png swap, og dimensions and sitemap encoding fixes"
            git push
          fi
