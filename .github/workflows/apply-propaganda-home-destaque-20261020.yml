name: Apply Propaganda home destaque 2026-10-20 (one-shot)

on:
  push:
    branches: ['feat/propaganda-500-home-destaque-20261020']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply home highlight and Propaganda price unit
        run: python scripts/apply_propaganda_home_destaque_20261020.py
      - name: Commit and push page changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html servicos.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(home): destaque criacao de anuncios R\$ 500 e preco Propaganda por imovel"
            git push origin HEAD:${{ github.ref_name }}
          fi
