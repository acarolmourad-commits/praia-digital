name: Fix broken internal links
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fix-links
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_links.py
      - name: Commit fixes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config user.name "praiadigital"
            git config user.email "comercial@praia.digital"
            git add -A
            git commit -m "fix(links): auto-fix systematic broken internal links (doubled paths, moved files)"
            git push
          else
            echo "No changes"
          fi
