name: Apply issue34 links lote1 2026-10-24 (one-shot)

on:
  push:
    branches: ["fix/issue-34-links-lote1-20261024"]
    paths:
      - "scripts/patch_issue34_links_20261024.py"
      - ".github/workflows/apply-issue34-links-lote1-20261024.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Corrigir links internos verificados (issue 34 lote 1)
        run: python scripts/patch_issue34_links_20261024.py
      - name: Commit and push page changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.html'
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
          else
            git commit -m "fix(site): corrige links internos verificados da issue #34 (lote 1)"
            git push origin "HEAD:${{ github.ref_name }}"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
