name: fix-leads-whatsapp-fallback
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplica fallback WhatsApp nos formularios de lead
        run: python3 scripts/fix_leads.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nada a commitar"; exit 0; fi
          git commit -m "fix(leads): fallback WhatsApp nos formularios (endpoint academy.praia.digital fora do ar) - 1065 paginas"
          git push
