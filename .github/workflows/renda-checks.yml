name: Income calculator checks
on:
  pull_request:
    paths:
      - 'apps/renda-para-financiar/**'
      - 'tests/renda-browser.cjs'
      - 'tests/check-app-link-targets.cjs'
      - 'tests/renda-calculator.cjs'
      - '.github/workflows/renda-checks.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Arithmetic and input regressions
        run: node --test tests/renda-calculator.cjs
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/bertioga-browser" playwright@1.63.0 --no-audit --no-fund
          "$RUNNER_TEMP/bertioga-browser/node_modules/.bin/playwright" install --with-deps chromium --only-shell
      - name: Check guide structure and responsive navigation
        run: NODE_PATH="$RUNNER_TEMP/bertioga-browser/node_modules" node tests/renda-browser.cjs
