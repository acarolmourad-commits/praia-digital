name: fix-canonicals-lote-11
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplica correcao de canonicals (lote 11)
        run: python3 scripts/fix_canonicals.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/
          if git diff --cached --quiet; then echo "nada a commitar"; exit 0; fi
          git commit -m "fix(blog): corrige canonical errado/duplicado - lote 11 (100 paginas)"
          git push
