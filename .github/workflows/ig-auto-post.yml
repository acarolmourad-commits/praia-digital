name: Instagram Content Validation (no publication)
on:
  schedule:
    - cron: '0 10,12,18,23 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ig-auto-post.yml'
      - 'scripts/ig_*.py'
      - 'scripts/ig_content_queue.json'
      - 'tests/test_ig*.py'
permissions:
  contents: read
concurrency:
  group: ig-auto-post
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - name: Test validation and publication safeguards
        run: python -m unittest discover -s tests -p 'test_ig*.py' -v
      - name: Validate content only (no publication)
        run: python scripts/ig_auto_post.py --dry-run
      - name: Explain validation result
        run: |
          echo '### Instagram: validation only' >> "$GITHUB_STEP_SUMMARY"
          echo 'No images generated or published. Composio production integration is not enabled.' >> "$GITHUB_STEP_SUMMARY"

