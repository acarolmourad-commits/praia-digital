name: Instagram Auto-Post (4x/dia)

on:
  schedule:
    # 7h, 9h, 15h e 20h horario de Brasilia (UTC-3)
    - cron: '0 10,12,18,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ig-auto-post
  cancel-in-progress: false

jobs:
  post:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - name: Verificar credenciais do Instagram
        id: ig_creds
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ] || [ -z "$IG_USER_ID" ]; then
            echo "::warning::IG_ACCESS_TOKEN/IG_USER_ID ausentes - publicacao ignorada sem falha. Configure os secrets para reativar."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ig_creds.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.ig_creds.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - run: pip install pillow requests
        if: steps.ig_creds.outputs.ready == 'true'
      - name: Gerar artes e publicar no Instagram
        if: steps.ig_creds.outputs.ready == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/ig_auto_post.py
