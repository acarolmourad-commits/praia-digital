name: Site Inspector (3x/dia)

on:
  pull_request:
    paths:
      - 'scripts/site_inspector.py'
      - 'tests/test_site_inspector.py'
      - '.github/workflows/site-inspector.yml'
  schedule:
    # Mesmos 21 horarios/semana (8h, 14h e 20h de Brasilia).
    - cron: '0 11 * * 1'       # Segunda 8h: internos + amostra HTTP externa
    - cron: '0 11 * * 0,2-6'   # Demais dias 8h: internos
    - cron: '0 17,23 * * *'    # Todos os dias 14h e 20h: internos
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline inspector regressions (no HTTP or issue publication)
        run: python3 -m unittest discover -s tests -p 'test_site_inspector.py' -v
  inspect:
    if: ${{ github.event_name != 'pull_request' && !github.event.repository.fork }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: site-inspector
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspecionar paginas e publicar relatorio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use o cron de origem; atrasos do Actions nao devem trocar a modalidade.
          CHECK_EXTERNAL: ${{ github.event_name == 'schedule' && github.event.schedule == '0 11 * * 1' }}
        run: |
          if [ "$CHECK_EXTERNAL" = 'true' ]; then
            python scripts/site_inspector.py --external
          else
            python scripts/site_inspector.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-inspection-report
          path: site_inspection_report.json
          if-no-files-found: error
          retention-days: 7
