name: Site Inspector (3x/dia)

on:
  pull_request:
    paths:
      - 'scripts/site_inspector.py'
      - 'scripts/link_inventory.py'
      - 'tests/test_link_inventory.py'
      - '.github/workflows/site-inspector.yml'
  schedule:
    # 8h, 14h e 20h horario de Brasilia (UTC-3)
    - cron: '0 11,17,23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_link_inventory.py' -v
  inspect:
    needs: regression
    if: ${{ github.event_name != 'pull_request' && !github.event.repository.fork }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspecionar paginas e publicar relatorio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/site_inspector.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-inspection-report
          path: site_inspection_report.json
          if-no-files-found: ignore
          retention-days: 30
