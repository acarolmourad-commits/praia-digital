name: Site Inspector (3x/dia)

on:
  schedule:
    # 8h, 14h e 20h horario de Brasilia (UTC-3)
    - cron: '0 11,17,23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspecionar paginas e publicar relatorio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/site_inspector.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-inspection-report
          path: site_inspection_report.json
          if-no-files-found: ignore
