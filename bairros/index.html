<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bairros do Litoral — Praia Digital</title>
<link rel="preconnect" href="https://praia.digital">
<link rel="stylesheet" href="/assets/css/ads-optimization.css">
</head>
<body>
  <h1>Bairros do litoral</h1>

  <!-- Feed listing: GPT slot injected every 5 cards -->
  <div class="grid" id="bairros-feed">
    <article class="card"><h2>Santos</h2><p>...</p></article>
    <article class="card"><h2>Guarujá</h2><p>...</p></article>
    <article class="card"><h2>São Vicente</h2><p>...</p></article>
    <article class="card"><h2>Praia Grande</h2><p>...</p></article>
    <article class="card"><h2>Bertioga</h2><p>...</p></article>
  </div>

  <!-- Article: in-article ad every 4 paragraphs -->
  <article id="report">
    <h1>Relatório de Mercado 2026</h1>
    <p>Paragraph 1...</p>
    <p>Paragraph 2...</p>
    <p>Paragraph 3...</p>
    <p>Paragraph 4...</p>
    <p>Paragraph 5...</p>
    <p>Paragraph 6...</p>
    <p>Paragraph 7...</p>
    <p>Paragraph 8...</p>
  </article>

  <script>
    window.PD_ADS = window.PD_ADS || {};
    PD_ADS.boot({
      adUnitPath: '/1234/praia-digital',
      targeting: {
        div: 'pd-gpt-slot',
        sizes: [[300,250],[336,280],[320,100]],
        key: 'page_type',
        keyValues: { page_type: 'bairros' }
      }
    });
  </script>
  <script src="/assets/js/ads-optimization.js"></script>
</body>
</html>
