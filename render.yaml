services:
  - type: web
    name: praia-digital-academy
    env: python
    buildCommand: pip install -r academy/requirements.txt
    startCommand: PYTHONPATH=academy uvicorn academy.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        # Preencha com a connection string do academy-db ja criado
        value: ""
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: EMAIL_FROM
        value: no-reply@praia.digital
      - key: ALLOWED_ORIGINS
        value: https://praia.digital,https://www.praia.digital,https://academy.praia.digital
      - key: MERCADOPAGO_TOKEN
        value: ""
      - key: MERCADOPAGO_PUBLIC_KEY
        value: ""
      - key: BASE_URL
        value: https://academy.praia.digital
      - key: WHATSAPP_API_URL
        value: ""
      - key: WHATSAPP_TOKEN
        value: ""
      - key: WHATSAPP_PHONE_ID
        value: ""
      - key: WHATSAPP_TO_NUMBER
        value: ""

