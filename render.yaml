services:
  - type: web
    name: praia-digital-academy
    env: python
    buildCommand: pip install -r academy/requirements.txt
    startCommand: cd academy && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: academy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: EMAIL_FROM
        value: no-reply@praia.digital
      - key: ALLOWED_ORIGINS
        value: https://praia.digital,https://www.praia.digital,https://academy.praia.digital

databases:
  - name: academy-db
    databaseName: academy
    user: academy
