<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} | Litoral Prime Imóveis</title>
  <meta name="description" content="{{description}}">
  <meta name="keywords" content="{{title}}, imóveis litoral paulista, Santos, Guarujá, Praia Grande, Bertioga, Itanhaém, Mongaguá, São Vicente, Peruíbe">
  <link rel="canonical" href="https://praia.digital/imoveis/{{slug}}.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}} | Litoral Prime Imóveis">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="https://praia.digital/img/default-home.jpg">
  <meta property="og:url" content="https://praia.digital/imoveis/{{slug}}.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}} | Litoral Prime Imóveis">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="https://praia.digital/img/default-home.jpg">
  <meta name="robots" content="index, follow">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "RealEstateListing",
    "name": "{{title}}",
    "description": "{{description}}",
    "url": "https://praia.digital/imoveis/{{slug}}.html",
    "provider": {"@type": "Organization", "name": "Litoral Prime Imóveis", "url": "https://praia.digital/"}
  }
  </script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{title}} | Litoral Prime Imóveis",
  "description": "{{description}}",
  "url": "https://praia.digital/imoveis/template-landing.html",
  "datePublished": "2026-08-03",
  "author": {
    "@type": "Organization",
    "name": "Praia Digital"
  },
  "publisher": {
    "@type": "Organization",
    "name": "Praia Digital",
    "url": "https://praia.digital/"
  }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Qual o conteúdo desta página?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "{{description}}"
      }
    },
    {
      "@type": "Question",
      "name": "Como obter mais informações?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Use o WhatsApp ou e-mail comercial@praia.digital."
      }
    },
    {
      "@type": "Question",
      "name": "Atendemos esta região?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sim, atendemos o litoral de São Paulo com imóveis e serviços especializados."
      }
    }
  ]
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Como solicitar mais informações?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Use o WhatsApp ou o formulário de contato da página do imóvel."
      }
    },
    {
      "@type": "Question",
      "name": "Este imóvel está disponível?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sim, entre em contato para confirmar disponibilidade e agendar visita."
      }
    },
    {
      "@type": "Question",
      "name": "Vocês financiam?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Trabalhamos com os principais bancos e consórcios imobiliários."
      }
    }
  ]
}
</script>
  <link rel="stylesheet" href="../css/style.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Início",
      "item": "https://praia.digital/index.html"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Imoveis",
      "item": "https://praia.digital/imoveis/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "Template Landing",
      "item": "https://praia.digital/imoveis/template-landing.html"
    }
  ]
}
</script>
</head>
<body>
  <header>
    <nav aria-label="Navegação principal">
      <div class="logo">
        <h1><picture><source srcset="https://praia.digital/img/default-home.jpg.webp" type="image/webp"><img src="https://praia.digital/img/default-home.jpg" alt="{{title}}" loading="lazy" width="800" height="600" decoding="async"></picture>🏖️ Litoral Prime Imóveis</h1>
        <p class="tagline">{{city}}</p>
      </div>
      <ul class="nav-menu">
        <li><a href="../index.html">Início</a></li>
        <li><a href="../servicos.html">Serviços</a></li>
        <li><a href="index.html">Imóveis</a></li>
      </ul>
    </nav>
  </header>
  <main id="main">
    <section class="hero">
      <picture>
        <source srcset="{{image}}.webp" type="image/webp">
        <img src="{{image}}" alt="{{title}}" loading="lazy" width="800" height="600" decoding="async">
      </picture>
      <h1>{{title}}</h1>
      <p class="subtitle">{{description}}</p>
      <a class="btn-whatsapp" href="{{whatsapp_link}}" target="_blank" rel="noopener">Tenho interesse neste imóvel</a>
    </section>
    <section class="servicos-section">
      <h2>Informações</h2>
      <div class="servicos-grid">
        <article class="servico-card">
          <h3>🏷️ Tipo</h3>
          <p>{{type}}</p>
        </article>
        <article class="servico-card">
          <h3>💰 Preço</h3>
          <p>{{price}}</p>
        </article>
        <article class="servico-card">
          <h3>🛏️ Quartos</h3>
          <p>{{bedrooms}}</p>
        </article>
        <article class="servico-card">
          <h3>📐 Área</h3>
          <p>{{area}}</p>
        </article>
      </div>
    </section>
    <section class="servicos-section">
      <h2>Destaques</h2>
      <div class="servicos-grid">
        {{tags}}
      </div>
    </section>
    <section class="servicos-section">
      <h2>Imóveis relacionados</h2>
      <div class="servicos-grid">
        {{related}}
      </div>
    </section>
  </main>
</body>
</html>
