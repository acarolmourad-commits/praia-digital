<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificado — Área do Aluno</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Certificado de conclusão do curso na Praia Digital Academy.">
  <link rel="canonical" href="https://praia.digital/education/aluno/certificado.html">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org/",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Início", "item": "https://praia.digital/index.html" },
      { "@type": "ListItem", "position": 2, "name": "Academy", "item": "https://praia.digital/education/index.html" },
      { "@type": "ListItem", "position": 3, "name": "Área do Aluno", "item": "https://praia.digital/education/aluno/index.html" },
      { "@type": "ListItem", "position": 4, "name": "Certificado", "item": "https://praia.digital/education/aluno/certificado.html" }
    ]
  }
  </script>
  <meta property="og:title" content="Certificado — Área do Aluno">
  <meta property="og:description" content="Certificado de conclusão do curso.">
  <meta property="og:url" content="https://praia.digital/education/aluno/certificado.html">
  <meta property="og:site_name" content="Praia Digital Academy">
  <meta name="theme-color" content="#0b1220">
  <link rel="preconnect" href="https://praia.digital">
  <style>
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#0b1220;color:#e8ecf1;margin:0;padding:0}
    .wrap{max-width:900px;margin:0 auto;padding:28px 22px}
    header nav a{color:#cfe3ff;text-decoration:none;margin-right:14px;font-weight:500}
    h1{font-size:2rem;margin:0 0 .5rem}
    .lead{opacity:.85;line-height:1.6;margin-bottom:1rem}
    .cert{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:22px 24px;margin-top:14px}
    .cta{background:#00B4D8;color:#fff;padding:.7rem 1.2rem;border-radius:999px;font-weight:700;text-decoration:none;display:inline-block;margin-top:.6rem;margin-right:10px;border:none;cursor:pointer}
    footer{margin-top:22px;opacity:.6;font-size:12px}
    .hidden{display:none}
    .error{color:#ff6b6b;margin-top:8px}
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=GA4_MEASUREMENT_ID"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'GA4_MEASUREMENT_ID', { anonymize_ip: true });
  </script>
</head>
<body>
  <div class="wrap">
    <header>
      <nav aria-label="Navegação principal">
        <a href="https://praia.digital/education/aluno/index.html">Área do Aluno</a>
        <a href="https://praia.digital/education/index.html">Academy</a>
      </nav>
    </header>

    <main id="main">
      <h1>Certificado</h1>
      <p class="lead">Acompanhe seus certificados e solicite emissão.</p>

      <div id="certArea"></div>

      <div id="loginPrompt" class="hidden">
        <div class="cert">
          <p>Faça login na <a href="/education/aluno/login.html">área do aluno</a>.</p>
        </div>
      </div>
    </main>

    <footer>Praia Digital Academy — área do aluno.</footer>
  </div>

  <script>
    const API_BASE = '/academy';
    const token = localStorage.getItem('academy_token') || sessionStorage.getItem('academy_token');

    function showLogin() {
      document.getElementById('certArea').classList.add('hidden');
      document.getElementById('loginPrompt').classList.remove('hidden');
    }

    async function loadCertificates() {
      if (!token) return showLogin();

      try {
        const res = await fetch(`${API_BASE}/certificates/me`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401) return showLogin();

        const certs = await res.json();
        const container = document.getElementById('certArea');
        container.innerHTML = '';

        if (!Array.isArray(certs) || certs.length === 0) {
          container.innerHTML = '<p>Você ainda não tem certificados. Conclua um curso para solicitar.</p>';
          return;
        }

        for (const c of certs) {
          const div = document.createElement('div');
          div.className = 'cert';
          div.innerHTML = `
            <p><strong>Código:</strong> ${c.code}</p>
            <p><strong>Curso ID:</strong> ${c.course_id}</p>
            <p><strong>Matrícula ID:</strong> ${c.enrollment_id}</p>
            <p><strong>Emitido em:</strong> ${c.issued_at || 'pendente'}</p>
            ${c.pdf_url ? `<a class="cta" href="${c.pdf_url}" target="_blank" rel="noopener">Baixar PDF</a>` : ''}
          `;
          container.appendChild(div);
        }
      } catch (err) {
        console.error('Erro ao carregar certificados:', err);
      }
    }

    if (token) {
      loadCertificates();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
