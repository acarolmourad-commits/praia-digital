<body style="background:#0b1220;color:#e8ecf1;min-height:100vh;display:flex;align-items:center;justify-content:center">
  <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:18px 20px;width:100%;max-width:420px">
    <h1 style="font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:.5rem">Área do Aluno</h1>
    <p style="color:#9ca3af;margin-bottom:1rem">Entre com seu e-mail e senha.</p>
    <form id="loginForm" style="display:flex;flex-direction:column;gap:1rem">
      <div>
        <label style="display:block;font-size:.875rem;color:#d1d5db;margin-bottom:.25rem">E-mail</label>
        <input id="email" type="email" required style="width:100%;background:#111827;border:1px solid #374151;border-radius:8px;padding:8px 12px;color:#fff" />
      </div>
      <div>
        <label style="display:block;font-size:.875rem;color:#d1d5db;margin-bottom:.25rem">Senha</label>
        <input id="password" type="password" required minlength="6" style="width:100%;background:#111827;border:1px solid #374151;border-radius:8px;padding:8px 12px;color:#fff" />
      </div>
      <button type="submit" style="width:100%;background:#00B4D8;color:#000;font-weight:700;padding:.5rem;border-radius:8px;border:none;cursor:pointer">Entrar</button>
      <p id="error" style="color:#f87171;font-size:.875rem;display:none"></p>
    </form>
    <p style="color:#9ca3af;font-size:.875rem;margin-top:1rem">Ainda não tem conta? <a href="/education/index.html" style="color:#00B4D8">Ver cursos</a>.</p>
  </div>

  <script>
    const apiBase = '/academy';
    const token = localStorage.getItem('academy_token') || sessionStorage.getItem('academy_token');
    if (token) {
      window.location.href = '/education/aluno/index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      try {
        const res = await fetch(apiBase + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.status === 200) {
          localStorage.setItem('academy_token', data.access_token);
          window.location.href = '/education/aluno/index.html';
        } else {
          errorEl.textContent = data.detail || 'Erro ao entrar.';
          errorEl.classList.remove('hidden');
        }
      } catch (err) {
        errorEl.textContent = 'Erro de conexão. Tente novamente.';
        errorEl.classList.remove('hidden');
      }
    });
  </script>
</body>
