<head>

  <meta name="description" content="Conteúdo do seu curso na Praia Digital Academy.">
  <link rel="canonical" href="https://praia.digital/education/aluno/curso.html">
  <script type="application/ld+json">

    "@context": "https://schema.org/",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Início", "item": "https://praia.digital/index.html" },
      { "@type": "ListItem", "position": 2, "name": "Academy", "item": "https://praia.digital/education/index.html" },
      { "@type": "ListItem", "position": 3, "name": "Área do Aluno", "item": "https://praia.digital/education/aluno/index.html" },
      { "@type": "ListItem", "position": 4, "name": "Meu Curso", "item": "https://praia.digital/education/aluno/curso.html" }
    ]

  <meta property="og:title" content="Meu Curso — Área do Aluno">
  <meta property="og:description" content="Acesse o conteúdo do seu curso.">
  <meta property="og:url" content="https://praia.digital/education/aluno/curso.html">
  <meta property="og:site_name" content="Praia Digital Academy">
  <meta name="theme-color" content="#0b1220">
  <link rel="preconnect" href="https://praia.digital">
  <style>
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#0b1220;color:#e8ecf1;margin:0;padding:0}
    .wrap{max-width:1100px;margin:0 auto;padding:28px 22px}
    header nav a{color:#cfe3ff;text-decoration:none;margin-right:14px;font-weight:500}
    h1{font-size:2rem;margin:0 0 .5rem}
    .lead{opacity:.85;line-height:1.6;margin-bottom:1rem}
    .grid{display:grid;gap:1rem;margin-top:1.2rem}
    .grid-3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
    .card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:18px 20px}
    .card a{color:#cfe3ff;font-weight:700;text-decoration:none}
    .cta{background:#00B4D8;color:#fff;padding:.7rem 1.2rem;border-radius:999px;font-weight:700;text-decoration:none;display:inline-block;margin-top:.6rem;margin-right:10px}
    .badge{background:rgba(0,180,216,.15);border:1px solid rgba(0,180,216,.35);color:#90E0EF;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;font-weight:700}
    .hidden{display:none}
    footer{margin-top:22px;opacity:.6;font-size:12px}
    .empty{opacity:.75;margin-top:10px}
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=GA4_MEASUREMENT_ID"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'GA4_MEASUREMENT_ID', { anonymize_ip: true });
  </script>
</head>
<body>
  <div class="wrap">
    <header>
      <nav aria-label="Navegação principal">
        <a href="https://praia.digital/education/aluno/index.html">Área do Aluno</a>
        <a href="https://praia.digital/education/index.html">Academy</a>
      </nav>
    </header>

    <main id="main">
      <h1>Meu Curso</h1>
      <p class="lead">Conteúdo organizado por módulos e aulas. Marque como concluído para acompanhar seu progresso.</p>

      <div id="courseSelect" class="card">
        <p>Selecione um curso para acessar o conteúdo:</p>
        <div id="courseList"></div>
        <p id="courseError" class="hidden" style="color:#ff6b6b;margin-top:8px"></p>
      </div>

      <div id="modulesArea" class="hidden">
        <div style="margin-top:18px">
          <a id="backLink" class="cta" href="/education/aluno/index.html">Voltar</a>
          <a id="progressLink" class="cta" style="background:#fff;color:#0b1220;margin-left:10px" href="#">Meu progresso</a>
        </div>
        <div id="modulesContainer" class="grid" style="margin-top:1rem"></div>
      </div>
    </main>

    <footer>Praia Digital Academy — área do aluno.</footer>
  </div>

  <script>
    const API_BASE = '/academy';
    const token = localStorage.getItem('academy_token') || sessionStorage.getItem('academy_token');

    function showModules() {
      document.getElementById('courseSelect').classList.add('hidden');
      document.getElementById('modulesArea').classList.remove('hidden');
    }

    function showCourses() {
      document.getElementById('courseSelect').classList.remove('hidden');
      document.getElementById('modulesArea').classList.add('hidden');
    }

    async function loadCourses() {
      if (!token) {
        document.getElementById('courseList').innerHTML = '<p class="empty">Faça login na <a href="/education/aluno/login.html">área do aluno</a>.</p>';
        return;
      }
      
      try {
        const res = await fetch(`${API_BASE}/me/courses`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401) {
          document.getElementById('courseList').innerHTML = '<p class="empty">Sessão expirada. <a href="/education/aluno/login.html">Entrar novamente</a>.</p>';
          return;
        }
        
        const enrollments = await res.json();
        const container = document.getElementById('courseList');
        container.innerHTML = '';
        
        if (!Array.isArray(enrollments) || enrollments.length === 0) {
          container.innerHTML = '<p class="empty">Você ainda não tem matrículas.</p>';
          return;
        }
        
        for (const enrollment of enrollments) {
          const btn = document.createElement('button');
          btn.className = 'cta';
          btn.style.marginRight = '10px';
          btn.textContent = enrollment.title;
          btn.addEventListener('click', () => loadCourse(enrollment.slug, enrollment.title));
          container.appendChild(btn);
        }
      } catch (err) {
        console.error('Erro ao carregar cursos:', err);
      }
    }

    async function loadCourse(slug, title) {
      try {
        const modulesRes = await fetch(`${API_BASE}/me/courses/${slug}/modules`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (modulesRes.status === 401) return showCourses();
        if (modulesRes.status === 403) {
          alert('Acesso não permitido para este curso.');
          return;
        }
        const modules = await modulesRes.json();
        const container = document.getElementById('modulesContainer');
        container.innerHTML = `<p style="opacity:.75">${title}</p>`;
        
        if (!Array.isArray(modules) || modules.length === 0) {
          container.innerHTML += '<p class="empty">Conteúdo em breve.</p>';
          showModules();
          return;
        }
        
        for (const module of modules) {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `<h3>${module.title}</h3><p style="opacity:.75; margin-top:6px;">${module.description || ''}</p>`;
          
          const lessonList = document.createElement('ul');
          lessonList.style.cssText = 'list-style:none;padding:0;margin-top:8px';
          
          for (const lesson of module.lessons || []) {
            const li = document.createElement('li');
            li.style.cssText = 'margin:4px 0';
            li.innerHTML = `<a href="/education/cursos/${slug}/curso-completo/modulo-${module.order}.md">${lesson.title}</a>`;
            lessonList.appendChild(li);
          }
          
          card.appendChild(lessonList);
          container.appendChild(card);
        }
        showModules();
      } catch (err) {
        console.error('Erro ao carregar curso:', err);
      }
    }

    if (token) {
      loadCourses();
    } else {
      document.getElementById('courseList').innerHTML = '<p class="empty">Faça login na <a href="/education/aluno/login.html">área do aluno</a>.</p>';
    }
  </script>
</body>
</html>
