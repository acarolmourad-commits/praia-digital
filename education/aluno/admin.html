<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Praia Digital Academy</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Admin — Praia Digital Academy",
    "url": "https://praia.digital/education/aluno/admin.html"
  }
  </script>

  <meta property="og:type" content="website">
  <meta property="og:title" content="Admin — Praia Digital Academy">
  <meta property="og:description" content="Admin — Praia Digital Academy">
  <meta property="og:url" content="https://praia.digital/education/aluno/admin.html">
  <meta property="og:site_name" content="Praia Digital Academy">
  <meta name="theme-color" content="#0b1220">

  <meta name="description" content="Painel administrativo da Praia Digital Academy: alunos, pedidos, certificados e métricas.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://praia.digital/education/aluno/admin.html">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Início", "item": "https://praia.digital/index.html" },
      { "@type": "ListItem", "position": 2, "name": "Academy", "item": "https://praia.digital/education/index.html" },
      { "@type": "ListItem", "position": 3, "name": "Admin", "item": "https://praia.digital/education/aluno/admin.html" }
    ]
  }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/axios@1.7.7/dist/axios.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { bg: '#0b1220', accent: '#00b4d8', surface: '#111827', text: '#e5e7eb' }
          }
        }
      }
    }
  </script>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=GA4_MEASUREMENT_ID"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'GA4_MEASUREMENT_ID', { anonymize_ip: true });
</script>
</head>
<body class="bg-brand-bg text-brand-text min-h-screen">
  <nav class="bg-brand-surface border-b border-gray-800">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-white font-bold text-xl">Admin — Praia Digital Academy</h1>
      <button onclick="logout()" class="bg-brand-accent text-black px-3 py-1.5 rounded text-sm font-semibold">Sair</button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <div class="bg-brand-surface p-5 rounded border border-gray-800">
        <p class="text-gray-400 text-sm">Alunos</p>
        <p id="usersCount" class="text-3xl font-bold text-white">0</p>
      </div>
      <div class="bg-brand-surface p-5 rounded border border-gray-800">
        <p class="text-gray-400 text-sm">Pedidos</p>
        <p id="ordersCount" class="text-3xl font-bold text-white">0</p>
      </div>
      <div class="bg-brand-surface p-5 rounded border border-gray-800">
        <p class="text-gray-400 text-sm">Certificados</p>
        <p id="certificatesCount" class="text-3xl font-bold text-white">0</p>
      </div>
    </div>

    <section class="mb-8">
      <h2 class="text-2xl font-bold text-white mb-4">Alunos</h2>
      <div id="usersList" class="bg-brand-surface rounded border border-gray-800 overflow-x-auto"></div>
    </section>

    <section class="mb-8">
      <h2 class="text-2xl font-bold text-white mb-4">Pedidos</h2>
      <div id="ordersList" class="bg-brand-surface rounded border border-gray-800 overflow-x-auto"></div>
    </section>

    <section>
      <h2 class="text-2xl font-bold text-white mb-4">Certificados</h2>
      <div id="certificatesList" class="bg-brand-surface rounded border border-gray-800 overflow-x-auto"></div>
    </section>
  </main>

  <script>
    const token = localStorage.getItem('admin_token');
    const apiBase = '/academy';

    async function api(path, opts = {}) {
      const headers = { ...(opts.headers  {}) };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const res = await axios.get(apiBase + path, { headers });
      return res.data;
    }

    async function loadStats() {
      const users = await api('/admin/users');
      const orders = await api('/admin/orders');
      const certificates = await api('/admin/certificates');
      document.getElementById('usersCount').textContent = users.length;
      document.getElementById('ordersCount').textContent = orders.length;
      document.getElementById('certificatesCount').textContent = certificates.length;

      const usersTable = document.getElementById('usersList');
      usersTable.innerHTML = '<table class="w-full text-left text-sm"><thead class="bg-gray-900 text-gray-300"><tr><th class="px-4 py-2">ID</th><th class="px-4 py-2">Nome</th><th class="px-4 py-2">E-mail</th><th class="px-4 py-2">Papel</th><th class="px-4 py-2">Status</th></tr></thead><tbody>' +
        users.map(u => `<tr class="border-t border-gray-800"><td class="px-4 py-2">${u.id}</td><td class="px-4 py-2">${u.name}</td><td class="px-4 py-2">${u.email}</td><td class="px-4 py-2">${u.role}</td><td class="px-4 py-2">${u.status}</td></tr>`).join('') +
        '</tbody></table>';

      const ordersTable = document.getElementById('ordersList');
      ordersTable.innerHTML = '<table class="w-full text-left text-sm"><thead class="bg-gray-900 text-gray-300"><tr><th class="px-4 py-2">ID</th><th class="px-4 py-2">Usuário</th><th class="px-4 py-2">Total</th><th class="px-4 py-2">Status</th><th class="px-4 py-2">Criado</th></tr></thead><tbody>' +
        orders.map(o => `<tr class="border-t border-gray-800"><td class="px-4 py-2">${o.id}</td><td class="px-4 py-2">${o.user_id}</td><td class="px-4 py-2">${o.total}</td><td class="px-4 py-2">${o.status}</td><td class="px-4 py-2">${o.created_at}</td></tr>`).join('') +
        '</tbody></table>';

      const certsTable = document.getElementById('certificatesList');
      certsTable.innerHTML = '<table class="w-full text-left text-sm"><thead class="bg-gray-900 text-gray-300"><tr><th class="px-4 py-2">ID</th><th class="px-4 py-2">Usuário</th><th class="px-4 py-2">Curso</th><th class="px-4 py-2">Código</th><th class="px-4 py-2">Emitido</th></tr></thead><tbody>' +
        certificates.map(c => `<tr class="border-t border-gray-800"><td class="px-4 py-2">${c.id}</td><td class="px-4 py-2">${c.user_id}</td><td class="px-4 py-2">${c.course_id}</td><td class="px-4 py-2">${c.code}</td><td class="px-4 py-2">${c.issued_at}</td></tr>`).join('') +
        '</tbody></table>';
    }

    function logout() {
      localStorage.removeItem('admin_token');
      window.location.href = '/education/aluno/login.html';
    }

    document.addEventListener('DOMContentLoaded', loadStats);
  </script>
</body>
</html>
