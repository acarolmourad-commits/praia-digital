<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Acompanhe seu progresso nos cursos da Praia Digital Academy.">
  <link rel="canonical" href="https://praia.digital/education/aluno/progresso.html">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org/",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Início", "item": "https://praia.digital/index.html" },
      { "@type": "ListItem", "position": 2, "name": "Academy", "item": "https://praia.digital/education/index.html" },
      { "@type": "ListItem", "position": 3, "name": "Área do Aluno", "item": "https://praia.digital/education/aluno/index.html" },
      { "@type": "ListItem", "position": 4, "name": "Meu Progresso", "item": "https://praia.digital/education/aluno/progresso.html" }
    ]
  }
  </script>
  <meta property="og:title" content="Meu Progresso — Praia Digital Academy">
  <meta property="og:description" content="Acompanhe sua evolução nos cursos.">
  <meta property="og:url" content="https://praia.digital/education/aluno/progresso.html">
  <meta property="og:site_name" content="Praia Digital Academy">
  <meta name="theme-color" content="#0b1220">
  <link rel="preconnect" href="https://praia.digital">
  <style>
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#0b1220;color:#e8ecf1;margin:0;padding:0}
    .wrap{max-width:1100px;margin:0 auto;padding:28px 22px}
    header nav a{color:#cfe3ff;text-decoration:none;margin-right:14px;font-weight:500}
    h1{font-size:2rem;margin:0 0 .5rem}
    .lead{opacity:.85;line-height:1.6;margin-bottom:1rem}
    .grid{display:grid;gap:1rem;margin-top:1.2rem}
    .grid-3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
    .card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:18px 20px}
    .cta{background:#00B4D8;color:#fff;padding:.7rem 1.2rem;border-radius:999px;font-weight:700;text-decoration:none;display:inline-block;margin-top:.6rem;margin-right:10px}
    .badge{background:rgba(0,180,216,.15);border:1px solid rgba(0,180,216,.35);color:#90E0EF;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;font-weight:700}
    .hidden{display:none}
    .bar{height:10px;background:rgba(255,255,255,0.1);border-radius:999px;overflow:hidden;margin-top:6px}
    .bar-fill{height:100%;background:#00B4D8;border-radius:999px;transition:width .3s}
    footer{margin-top:22px;opacity:.6;font-size:12px}
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=GA4_MEASUREMENT_ID"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'GA4_MEASUREMENT_ID', { anonymize_ip: true });
  </script>
</head>
<body>
  <div class="wrap">
    <header>
      <nav aria-label="Navegação principal">
        <a href="https://praia.digital/education/aluno/index.html">Área do Aluno</a>
        <a href="https://praia.digital/education/index.html">Academy</a>
      </nav>
    </header>

    <main id="main">
      <h1>Meu Progresso</h1>
      <p class="lead">Acompanhe sua evolução em cada curso.</p>

      <div id="progressArea" class="grid grid-3"></div>

      <div id="loginPrompt" class="hidden">
        <div class="card">
          <h3>Faça login para ver seu progresso</h3>
          <p>Entre na <a href="/education/aluno/login.html">área do aluno</a>.</p>
        </div>
      </div>
    </main>

    <footer>Praia Digital Academy — área do aluno.</footer>
  </div>

  <script>
    const API_BASE = '/academy';
    const token = localStorage.getItem('academy_token') || sessionStorage.getItem('academy_token');

    function showLogin() {
      document.getElementById('progressArea').classList.add('hidden');
      document.getElementById('loginPrompt').classList.remove('hidden');
    }

    async function loadProgress() {
      if (!token) return showLogin();

      try {
        const res = await fetch(`${API_BASE}/me/progress`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401) return showLogin();

        const items = await res.json();
        const container = document.getElementById('progressArea');
        container.innerHTML = '';

        if (!Array.isArray(items) || items.length === 0) {
          container.innerHTML = '<p>Você ainda não tem progresso registrado.</p>';
          return;
        }

        for (const item of items) {
          const percent = Math.round(item.progress_percent || 0);
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <a href="/education/cursos/${item.course_slug}/index.html" style="color:#cfe3ff;font-weight:700;text-decoration:none">${item.course_title}</a>
            <p style="opacity:.75; margin-top:6px;">${item.completed_lessons || 0} de ${item.total_lessons || 0} aulas</p>
            <div class="bar"><div class="bar-fill" style="width:${percent}%"></div></div>
            <p style="font-size:.85rem;margin-top:6px;opacity:.85">${percent}%</p>
          `;
          container.appendChild(card);
        }
      } catch (err) {
        console.error('Erro ao carregar progresso:', err);
      }
    }

    if (token) {
      loadProgress();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
