<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Praia Digital Academy</title>
<meta name="description" content="Finalize sua compra na Praia Digital Academy. Pagamento seguro, acesso imediato.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://praia.digital/education/checkout.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Checkout — Praia Digital Academy">
<meta property="og:description" content="Finalize sua compra com acesso imediato ao curso.">
<meta property="og:url" content="https://praia.digital/education/checkout.html">
<meta property="og:site_name" content="Praia Digital Academy">
<link rel="stylesheet" href="https://praia.digital/css/style.css">
<meta name="theme-color" content="#0b1220">
<link rel="preconnect" href="https://praia.digital">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Início", "item": "https://praia.digital/index.html" },
    { "@type": "ListItem", "position": 2, "name": "Academy", "item": "https://praia.digital/education/index.html" },
    { "@type": "ListItem", "position": 3, "name": "Checkout", "item": "https://praia.digital/education/checkout.html" }
  ]
}
</script>
</head>
<body>
<div class="wrap">
<meta name="pd-shared-nav">
<main id="main">
  <h1>Finalizar compra <span class="badge">Checkout</span></h1>
  <p class="lead">Preencha seus dados para acessar o curso escolhido.</p>

  <div class="card" id="course-info">
    <div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:center">
      <img id="course-cover" src="" alt="" style="width:120px;height:80px;object-fit:cover;border-radius:10px;display:none">
      <div style="flex:1;min-width:200px">
        <p><strong>Curso:</strong> <span id="course-name">—</span></p>
        <p id="course-description" style="color:#94a3b8;font-size:.9rem;margin-top:.2rem"></p>
        <p class="price" id="course-price">R$ 0</p>
        <p style="font-size:.9rem;color:#94a3b8">
          De <span id="course-price-original">R$ 0</span> 
          <span style="color:#4ade80">• Pix: <span id="course-price-pix">R$ 0</span></span>
        </p>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:1rem">
    <h2 style="margin-top:0">Forma de pagamento</h2>
    <label style="display:flex;align-items:center;gap:.5rem;margin:.4rem 0">
      <input type="radio" name="payment-method" value="pix" checked> <strong>PIX</strong> <span style="color:#4ade80">5% desconto</span>
    </label>
    <label style="display:flex;align-items:center;gap:.5rem;margin:.4rem 0">
      <input type="radio" name="payment-method" value="card"> <strong>Cartão de crédito</strong> <span style="color:#94a3b8">até 12x</span>
    </label>
  </div>

  <div class="card" style="margin-top:1rem">
    <h2 style="margin-top:0">Seus dados</h2>
    <form id="checkout-form">
      <label>Nome completo
        <input type="text" id="name" required placeholder="Seu nome completo">
      </label>
      <label>E-mail
        <input type="email" id="email" required placeholder="seu@email.com">
      </label>
      <label>Confirme seu e-mail
        <input type="email" id="email-confirm" required placeholder="seu@email.com">
        <span id="email-confirm-error" style="color:#facc15;font-size:.85rem;display:none">Os e-mails não coincidem</span>
      </label>
      <label>WhatsApp
        <input type="tel" id="phone" required placeholder="(11) 99999-9999">
      </label>
      <label>CPF/CNPJ
        <input type="text" id="document" required placeholder="000.000.000-00">
      </label>

      <div id="pix-form" style="margin-top:1rem">
        <div style="background:#0b2d4d;padding:1rem;border-radius:12px;text-align:center">
          <p style="margin:.5rem 0"><strong>QR Code PIX</strong></p>
          <img id="qr-code" src="" alt="QR Code PIX" style="max-width:220px;display:none">
          <p style="font-size:.85rem;color:#94a3b8;margin-top:.5rem">Código expira em: <span id="pix-expires">--</span></p>
          <label style="text-align:left;margin-top:.8rem">Código Copia e Cola
            <input type="text" id="qr-code-raw" readonly style="font-size:.8rem">
          </label>
          <p style="font-size:.85rem;color:#94a3b8;margin-top:.5rem">Após o pagamento, a confirmação é automática.</p>
        </div>
      </div>

      <div id="card-form" style="display:none;margin-top:1rem">
        <label>Número do cartão
          <input type="text" id="card-number" placeholder="0000 0000 0000 0000">
        </label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
          <label>Validade
            <input type="text" id="card-expiry" placeholder="MM/AA">
          </label>
          <label>CVC
            <input type="text" id="card-cvc" placeholder="000">
          </label>
        </div>
        <label>Nome no cartão
          <input type="text" id="card-name" placeholder="Como no cartão">
        </label>
        <label>Parcelas
          <select id="installments"></select>
        </label>
        <p style="font-size:.9rem;color:#94a3b8;margin-top:.5rem">
          Parcela: <span id="installment-preview">--</span><br>
          Total: <span id="installment-total">--</span>
        </p>
      </div>

      <button type="submit" id="submit-payment" class="cta">Confirmar pagamento</button>
      <p id="payment-status" style="margin-top:.6rem;color:#94a3b8;font-size:.9rem"></p>
    </form>
  </div>

  <div id="result" class="card" style="margin-top:1rem;display:none"></div>
</main>
<meta name="pd-shared-footer">
</div>
<script src="/education/assets/js/checkout.js"></script>
<script src="https://praia.digital/js/shared.js"></script>
</body>
</html>
