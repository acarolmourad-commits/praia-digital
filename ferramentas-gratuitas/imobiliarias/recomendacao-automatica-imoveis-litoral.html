    <h1>Recomendação automática de imóveis</h1>
    <p>Informe preferências e receba imóveis direcionados.</p>
    <form onsubmit="event.preventDefault();const c=document.getElementById('c').value||'';const b=document.getElementById('b').value||'';const p=parseInt(document.getElementById('p').value)||0;const r=document.querySelector('.result');r.style.display='block';r.textContent='Com base em '+c+', '+b+' e orçamento até R$ '+p.toLocaleString('pt-BR')+', recomendamos começar pelos imóveis com SEO local e avaliação de preço atualizada.';" aria-label="Contact form">

      <label>Bairro ou região</label>
      <input id="b" placeholder="Ex: beira-mar, centro">
      <label>Orçamento máximo</label>
      <input id="p" type="number" placeholder="Ex: 900000">
