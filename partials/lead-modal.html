<div id="leadModal" class="lead-modal" aria-hidden="true" role="dialog" aria-label="Captura de leads">
  <div class="lead-modal-backdrop" aria-hidden="true"></div>
  <div class="lead-modal-card">
    <button class="lead-modal-close" aria-label="Fechar modal">&times;</button>
    <h2>Quer saber quais módulos da Riviera vão valorizar mais em 2026/2027?</h2>
    <p>Baixe a Análise de Mercado Imobiliário em PDF diretamente aqui.</p>
    <form id="leadModalForm" class="lead-modal-form" onsubmit="return false;">
      <input type="text" id="leadName" placeholder="Nome" required>
      <input type="tel" id="leadPhone" placeholder="WhatsApp" required>
      <button class="btn btn-primary" type="submit">Baixar análise gratuita</button>
    </form>
    <p class="lead-modal-success" style="display:none">Obrigado! Sua análise foi liberada abaixo e também foi enviada para o seu WhatsApp.</p>
    <p class="muted">Não enviamos spam. Seu contato é tratado com segurança.</p>
  </div>
</div>
