<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>{{TITLE}} | Praia Digital</title>
<meta name="description" content="{{META_DESCRIPTION}}"/>
<meta name="keywords" content="{{KEYWORDS_LIST}}"/>
<meta name="pd-shared-nav">
<link rel="canonical" href="{{URL}}"/>
<link rel="stylesheet" href="https://praia.digital/css/style.css"/>
</head>
<body>
<article>
  <header>
    <h1>{{TITLE}}</h1>
    <p class="meta">{{CITY}} | {{CLUSTER}} | {{DATE}}</p>
  </header>
  <section>
    <p>Conteúdo em desenvolvimento: {{PRIMARY_KEYWORD}}.</p>
  </section>
  <aside>
    <p>{{CTA_TEXT}}</p>
    <a href="{{HOTMART_LINK}}" class="cta-button">Saiba mais</a>
  </aside>
</article>
<meta name="pd-shared-footer">
<script src="https://praia.digital/js/shared.js"></script>
</body>
</html>
