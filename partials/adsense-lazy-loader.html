<script>
(function(){
  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting) {
          const el = entry.target;
          const adId = el.getAttribute('data-ad-id');
          if (adId && !el.hasAttribute('data-ad-loaded')) {
            el.setAttribute('data-ad-loaded', 'true');
            // Placeholder para substituição futura pelo snippet AdSense real
            el.innerHTML = '<div style="min-height:' + el.style.minHeight + ';display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:.9rem">Anúncio</div>';
          }
          observer.unobserve(el);
        }
      });
    }, { rootMargin: '200px' });
    
    document.querySelectorAll('.adsense-block[data-ad-id]').forEach(function(el){
      observer.observe(el);
    });
  }
})();
</script>
