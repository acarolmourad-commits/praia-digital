<div id="assistantModal" class="assistant-modal" aria-hidden="true" role="dialog" aria-label="Assistente virtual">
  <div class="assistant-modal-backdrop" aria-hidden="true"></div>
  <div class="assistant-modal-card">
    <button class="assistant-modal-close" aria-label="Fechar assistente">&times;</button>
    <h2>Assistente Virtual — Praia Digital</h2>
    <div class="assistant-messages" id="assistantMessages"></div>
    <div class="assistant-quick-replies" id="assistantQuickReplies"></div>
    <form id="assistantForm" class="assistant-form" onsubmit="return false;">
      <input type="text" id="assistantInput" placeholder="Digite sua dúvida..." autocomplete="off">
      <button class="btn btn-primary" type="submit">Enviar</button>
    </form>
  </div>
</div>
