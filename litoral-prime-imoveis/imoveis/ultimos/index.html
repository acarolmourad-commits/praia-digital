<script>
(function() {
  fetch('../imoveis/properties-index.json').then(r => r.ok ? r.json() : Promise.reject()).then(data => {
    const items = (data || []).slice().sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, 20);
    const box = document.getElementById('ultimos-imoveis');
    if (!items.length) { box.innerHTML = '<p>Sem novidades no momento.</p>'; return; }
    box.innerHTML = items.map(x => `<a class="property-card" href="../${x.slug || x.title}.html"><img src="../${x.image || 'img/placeholder.png'}" alt="${(x.title || x.slug || 'Imóvel')}" loading="lazy"><div><h3>${x.title || x.slug || 'Imóvel'}</h3><p>${x.city || ''} • ${x.type || ''}</p><small>${x.price || ''}</small></div></a>`).join('');
  }).catch(() => {
    document.getElementById('ultimos-imoveis').innerHTML = '<p>Conteúdo indisponível no momento.</p>';
  });
})();
</script>
