<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin — Praia Digital</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Painel administrativo — controle total de compras, financeiro, clientes e fornecedores.">
  <link rel="canonical" href="https://praia.digital/admin/painel.html">
  <style>
    :root {
      --dark: #023047;
      --ocean: #0077B6;
      --ocean-light: #00B4D8;
      --sand: #F4EBD0;
      --white: #FFFFFF;
      --success: #2d9e5a;
      --error: #e53e3e;
      --warning: #f59e0b;
      --gray: #64748b;
      --gray-light: #e2e8f0;
      --sidebar-w: 260px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, sans-serif;
      background: #f0f4f8; color: var(--dark);
      min-height: 100vh;
      display: flex;
    }
    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--dark);
      color: var(--white);
      flex-shrink: 0;
      overflow-y: auto;
      padding: 1.5rem 1rem;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .sidebar h1 {
      font-size: 1.3rem; color: var(--ocean-light);
      margin-bottom: 1.5rem; padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .sidebar a {
      display: block; padding: 0.6rem 0.8rem;
      color: var(--gray-light); text-decoration: none;
      border-radius: 6px; margin-bottom: 0.3rem;
      font-size: 0.9rem; transition: all 0.2s;
    }
    .sidebar a:hover, .sidebar a.active {
      background: var(--ocean); color: var(--white);
    }
    .sidebar a i { margin-right: 0.5rem; }
    /* Main */
    .main { flex: 1; padding: 2rem; max-width: 1400px; margin: 0 auto; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2rem;
    }
    .topbar h2 { font-size: 1.6rem; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem; margin-bottom: 2rem;
    }
    .card {
      background: var(--white); border-radius: 12px;
      padding: 1.25rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border: 1px solid var(--gray-light);
    }
    .card .label {
      font-size: 0.8rem; color: var(--gray); text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .card .value { font-size: 1.8rem; font-weight: 800; margin-top: 0.3rem; }
    .card .value.positive { color: var(--success); }
    .card .value.negative { color: var(--error); }
    .card .value.accent { color: var(--ocean); }
    /* Tables */
    table {
      width: 100%; border-collapse: collapse;
      background: var(--white); border-radius: 12px;
      overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border: 1px solid var(--gray-light);
    }
    th, td { padding: 0.7rem 1rem; text-align: left; font-size: 0.85rem; }
    th { background: var(--dark); color: var(--white); font-weight: 600; }
    td { border-bottom: 1px solid var(--gray-light); }
    tr:hover td { background: rgba(0,119,182,0.03); }
    .badge {
      display: inline-block; padding: 0.2rem 0.6rem;
      border-radius: 999px; font-size: 0.72rem; font-weight: 700;
    }
    .badge.aprovada { background: #d1fae5; color: var(--success); }
    .badge.pendente { background: #fef3c7; color: var(--warning); }
    .badge.cancelada { background: #fee2e2; color: var(--error); }
    .badge.recebida { background: #d1fae5; color: var(--success); }
    .badge.divergente { background: #fee2e2; color: var(--error); }
    /* Alertas */
    .alerts { margin-bottom: 2rem; }
    .alert {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 0.5rem;
      font-size: 0.85rem;
    }
    .alert.error { background: #fee2e2; color: var(--error); border-left: 4px solid var(--error); }
    .alert.warning { background: #fef3c7; color: var(--warning); border-left: 4px solid var(--warning); }
    /* Modal */
    .modal {
      display: none; position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh; background: rgba(0,0,0,0.6);
      z-index: 1000; overflow-y: auto; padding: 2rem;
    }
    .modal.active { display: block; }
    .modal-content {
      background: var(--white); border-radius: 16px;
      max-width: 700px; margin: 0 auto; max-height: 85vh;
      overflow-y: auto; position: relative;
    }
    .modal-close {
      position: absolute; top: 1rem; right: 1rem;
      background: transparent; border: none; font-size: 1.5rem; cursor: pointer;
    }
    .modal-body { padding: 1.5rem 2rem; }
    /* Form */
    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: var(--dark);
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--gray-light);
      border-radius: 8px; font-size: 0.9rem;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none; border-color: var(--ocean); box-shadow: 0 0 0 2px rgba(0,119,182,0.1);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .btn-primary {
      background: var(--ocean); color: var(--white); border: none;
      padding: 0.7rem 1.5rem; border-radius: 8px; font-weight: 700; cursor: pointer;
    }
    .btn-primary:hover { background: #055c91; }
    .btn-secondary {
      background: var(--gray-light); color: var(--dark); border: none;
      padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    /* Filters */
    .filters {
      background: var(--white); border-radius: 12px; padding: 1rem 1.5rem;
      margin-bottom: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border: 1px solid var(--gray-light);
    }
    .filters .filter-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem; align-items: end;
    }
    .filters button { padding: 0.6rem 1rem; }
    /* Tab navigation */
    .tabs {
      display: flex; gap: 0; margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--gray-light);
    }
    .tab {
      padding: 0.7rem 1.5rem; background: none; border: none;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      color: var(--gray); border-radius: 8px 8px 0 0;
    }
    .tab.active { background: var(--ocean); color: var(--white); }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: relative; padding: 1rem; }
      .sidebar h1 { font-size: 1.1rem; }
      .main { padding: 1rem; }
      .cards { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <meta name="pd-shared-nav">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h1>🌊 Praia Digital Admin</h1>
    <a href="#" class="active" data-tab="dashboard"><i>📊</i> Dashboard</a>
    <a href="/admin/painel.html?tab=solicitacoes" data-tab="solicitacoes"><i>🛒</i> Solicitações</a>
    <a href="/admin/painel.html?tab=pedidos" data-tab="pedidos"><i>📦</i> Pedidos</a>
    <a href="/admin/painel.html?tab=fornecedores" data-tab="fornecedores"><i>🏢</i> Fornecedores</a>
    <a href="/admin/painel.html?tab=clientes" data-tab="clientes"><i>👥</i> Clientes</a>
    <a href="/admin/painel.html?tab=produtos" data-tab="produtos"><i>🏷️</i> Produtos</a>
    <a href="/admin/painel.html?tab=financeiro" data-tab="financeiro"><i>💰</i> Financeiro</a>
    <a href="/admin/painel.html?tab=auditoria" data-tab="auditoria"><i>🔍</i> Auditoria</a>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <h2>Painel Administrativo</h2>
    </div>

    <!-- Dashboard Cards -->
    <div class="cards" id="dashboard-cards">
      <div class="card">
        <div class="label">Saldo Previsto</div>
        <div class="value accent" id="saldo-previsto">R$ 0</div>
      </div>
      <div class="card">
        <div class="label">Receitas (mês)</div>
        <div class="value positive" id="receitas-mes">R$ 0</div>
      </div>
      <div class="card">
        <div class="label">Despesas (mês)</div>
        <div class="value negative" id="despesas-mes">R$ 0</div>
      </div>
      <div class="card">
        <div class="label">Lucro Operacional</div>
        <div class="value accent" id="lucro-operacional">R$ 0</div>
      </div>
    </div>

    <!-- Alertas -->
    <div class="alerts" id="alerts-container">
      <!-- Alertas dinâmicos -->
    </div>

    <!-- Tables -->
    <table id="main-table">
      <thead>
        <tr id="table-header"></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </main>

  <!-- Modal genérico -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <meta name="pd-shared-footer">

  <script>
    // Tab navigation
    function showTab(tabName) {
      const url = new URL(window.location.href);
      url.searchParams.set('tab', tabName);
      window.history.replaceState({}, '', url);
      loadTabContent(tabName);
    }

    function getTabFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('tab') || 'dashboard';
    }

    // Carregar conteúdo da tab via API
    function loadTabContent(tab) {
      const headers = {'Authorization': 'Bearer ' + (localStorage.getItem('pd_admin_token') || '')};
      let endpoint = '';

      switch(tab) {
        case 'dashboard':
          fetchDashboard();
          return;
        case 'solicitacoes':
          endpoint = '/admin/solicitacoes'; break;
        case 'pedidos':
          endpoint = '/admin/ordens'; break;
        case 'fornecedores':
          endpoint = '/admin/fornecedores'; break;
        case 'clientes':
          endpoint = '/admin/clientes'; break;
        case 'produtos':
          endpoint = '/admin/produtos'; break;
        case 'financeiro':
          endpoint = '/admin/financeiro/lancamentos'; break;
        case 'auditoria':
          endpoint = '/admin/auditoria'; break;
      }

      if (endpoint) {
        fetch(endpoint, {headers})
          .then(r => r.json())
          .then(data => renderTable(tab, data))
          .catch(err => console.error('Error:', err));
      }
    }

    function fetchDashboard() {
      const headers = {'Authorization': 'Bearer ' + (localStorage.getItem('pd_admin_token') || '')};

      // Resumo financeiro
      fetch('/admin/dashboard/resumo', {headers})
        .then(r => r.json())
        .then(data => {
          document.getElementById('saldo-previsto').textContent = formatCurrency(data.saldo_previsto);
          document.getElementById('receitas-mes').textContent = formatCurrency(data.receitas_previstas);
          document.getElementById('despesas-mes').textContent = formatCurrency(data.despesas_previstas);
          document.getElementById('lucro-operacional').textContent = formatCurrency(data.dre.lucro_operacional);

          // Alertas
          const alertsDiv = document.getElementById('alerts-container');
          alertsDiv.innerHTML = '';
          if (data.alertas && data.alertas.length > 0) {
            data.alertas.forEach(a => {
              const div = document.createElement('div');
              div.className = 'alert ' + (a.tipo.includes('vencida') ? 'error' : 'warning');
              div.textContent = a.mensagem;
              alertsDiv.appendChild(div);
            });
          }
          // Tabela de solicitações recentes
          fetch('/admin/solicitacoes', {headers})
            .then(r => r.json())
            .then(data => renderTable('solicitacoes', data.slice(0, 10)));
        })
        .catch(err => console.error('Error:', err));
    }

    function formatCurrency(v) {
      return 'R$ ' + (Math.round(v || 0)).toLocaleString('pt-BR');
    }

    function renderTable(tab, data) {
      const thead = document.getElementById('table-header');
      const tbody = document.getElementById('table-body');
      thead.innerHTML = '';
      tbody.innerHTML = '';

      if (!data || data.length === 0) {
        thead.innerHTML = '<th colspan="100%">Nenhum registro</th>';
        return;
      }

      const keys = Object.keys(data[0]).filter(k => !k.startsWith('_'));
      keys.slice(0, 7).forEach(k => {
        const th = document.createElement('th');
        th.textContent = k.charAt(0).toUpperCase() + k.slice(1).replace(/_/g, ' ');
        thead.appendChild(th);
      });

      data.forEach(item => {
        const tr = document.createElement('tr');
        keys.slice(0, 7).forEach(k => {
          const td = document.createElement('td');
          td.textContent = formatCell(item[k]);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function formatCell(val) {
      if (val === null || val === undefined) return '-';
      if (typeof val === 'object') return JSON.stringify(val).substring(0, 30);
      return String(val);
    }

    function openModal(title, html) {
      document.getElementById('modal-body').innerHTML = '<h3>' + title + '</h3>' + html;
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    // Event listeners for sidebar
    document.querySelectorAll('.sidebar a[data-tab]').forEach(a => {
      a.addEventListener('click', function(e) {
        e.preventDefault();
        const tab = this.getAttribute('data-tab');
        showTab(tab);
      });
    });

    // Init
    const tab = getTabFromUrl();
    showTab(tab);
  </script>

  <script src="https://praia.digital/js/shared.js?v=2.0"></script>
  <script>
  // Auth check
  if (!localStorage.getItem('pd_admin_token')) {
    // Show login prompt
    const modalHtml = '<p style="margin-bottom:1rem;">Faça login no sistema de administração.</p>' +
      '<input type="password" id="adminPass" placeholder="Senha de admin" style="width:100%;padding:0.6rem;margin-bottom:1rem;border:1px solid #ddd;border-radius:8px;">' +
      '<button onclick="loginAdmin()" class="btn-primary">Entrar</button>';
    openModal('Login Admin', modalHtml);
  }

  function loginAdmin() {
    const pass = document.getElementById('adminPass').value;
    if (!pass) { alert('Digite a senha'); return; }
    fetch('/admin/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: pass})
    })
    .then(r => {
      if (!r.ok) throw new Error('Login falhou');
      return r.json();
    })
    .then(data => {
      if (data.token) {
        localStorage.setItem('pd_admin_token', data.token);
        closeModal();
        const tab = getTabFromUrl();
        showTab(tab);
      }
    })
    .catch(err => {
      alert('Erro: ' + err.message);
    });
  }
  </script>
</body>
</html>
